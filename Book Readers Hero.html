<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marginalia — A sanctuary for readers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root {
      --font-display: 'Instrument Serif', serif;
      --font-body: 'Inter', sans-serif;

      /* dark theme — HSL channels for Tailwind/CSS variable use */
      --background: 201 100% 13%;
      --foreground: 0 0% 100%;
      --muted-foreground: 240 4% 66%;
      --primary: 0 0% 100%;
      --primary-foreground: 0 0% 4%;
      --secondary: 0 0% 10%;
      --muted: 0 0% 10%;
      --accent: 0 0% 10%;
      --border: 0 0% 18%;
      --input: 0 0% 18%;
    }

    html, body, #root { height: 100%; }
    body {
      margin: 0;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    .text-foreground { color: hsl(var(--foreground)); }
    .text-muted-foreground { color: hsl(var(--muted-foreground)); }
    .bg-background { background-color: hsl(var(--background)); }

    /* Liquid glass — per spec */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: transform 220ms ease, background 220ms ease;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events: none;
    }
    .liquid-glass:hover { background: rgba(255, 255, 255, 0.04); }

    /* Animations */
    @keyframes fade-rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-rise        { animation: fade-rise 0.8s ease-out both; }
    .animate-fade-rise-delay  { animation: fade-rise 0.8s ease-out 0.2s both; }
    .animate-fade-rise-delay-2{ animation: fade-rise 0.8s ease-out 0.4s both; }
    .animate-fade-rise-delay-3{ animation: fade-rise 0.8s ease-out 0.6s both; }
    .animate-fade-rise-delay-4{ animation: fade-rise 0.8s ease-out 0.8s both; }

    /* Slow drift on the video so static scenes still feel alive */
    @keyframes vignette-pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.7;  }
    }
    .vignette { animation: vignette-pulse 9s ease-in-out infinite; }

    /* Smooth scroll for marker rail */
    @keyframes ticker {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .ticker-track { animation: ticker 60s linear infinite; }

    /* Custom selection */
    ::selection { background: hsl(var(--foreground) / 0.9); color: hsl(var(--background)); }

    /* Hairline divider tint */
    .hairline { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "headlineVariant": "readers",
      "palette": "deep-navy",
      "ctaLabel": "Begin Reading",
      "showStats": true,
      "showTicker": true,
      "videoOpacity": 0.55
    }/*EDITMODE-END*/;

    const HEADLINES = {
      stories: {
        plain: ['Where', 'rise through', '.'],
        em:    ['stories', 'the silence'],
        order: ['Where ', { em: 0 }, ' ', { plain: 1 }, ' ', { em: 1 }, { plain: 2 }],
      },
      readers: {
        order: ['For readers who ', { em: 0 }, ' between ', { em: 1 }, '.'],
        em: ['live', 'the lines'],
      },
      margins: {
        order: ['The world ', { em: 0 }, ' the margins.'],
        em: ['lives in'],
      },
    };

    const PALETTES = {
      'deep-navy':   { bg: '201 100% 13%', name: 'Deep Navy' },
      'ink-black':   { bg: '220 14% 6%',   name: 'Ink Black' },
      'oxblood':     { bg: '356 45% 14%',  name: 'Oxblood' },
      'forest':      { bg: '160 35% 10%',  name: 'Forest' },
    };

    const VIDEO_SRC = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4';

    function renderHeadline(variant) {
      const data = HEADLINES[variant] || HEADLINES.stories;
      return data.order.map((part, i) => {
        if (typeof part === 'string') return <React.Fragment key={i}>{part}</React.Fragment>;
        if ('em' in part) {
          return (
            <em key={i} className="not-italic text-muted-foreground">{data.em[part.em]}</em>
          );
        }
        if ('plain' in part) {
          return <React.Fragment key={i}>{data.plain ? data.plain[part.plain] : ''}</React.Fragment>;
        }
        return null;
      });
    }

    function App() {
      const [t, setTweak] = (window.useTweaks
        ? window.useTweaks(TWEAK_DEFAULTS)
        : [TWEAK_DEFAULTS, () => {}]);

      const videoRef = useRef(null);

      // apply palette to root
      useEffect(() => {
        const pal = PALETTES[t.palette] || PALETTES['deep-navy'];
        document.documentElement.style.setProperty('--background', pal.bg);
      }, [t.palette]);

      // apply video opacity
      useEffect(() => {
        if (videoRef.current) videoRef.current.style.opacity = String(t.videoOpacity);
      }, [t.videoOpacity]);

      const nav = [
        { label: 'Reading Room', active: true },
        { label: 'Shelves', active: false },
        { label: 'Marginalia', active: false },
        { label: 'Letters', active: false },
        { label: 'Contact', active: false },
      ];

      // ticker content — quietly literary, no real titles
      const tickerItems = [
        '— Currently on the desk —',
        'Vol. iv · Notes on slow attention',
        'A reading list for long winters',
        'Issue 12 · The art of re-reading',
        'New essay · On finishing books',
        'Field guide · How to keep a commonplace',
      ];

      return (
        <div className="relative w-full bg-background">
        {/* ===== HERO ===== */}
        <section className="relative min-h-screen w-full overflow-hidden">
          {/* Background video */}
          <video
            ref={videoRef}
            className="absolute inset-0 w-full h-full object-cover z-0"
            autoPlay
            loop
            muted
            playsInline
            poster=""
            style={{ opacity: t.videoOpacity }}
          >
            <source src={VIDEO_SRC} type="video/mp4" />
          </video>

          {/* Tinted overlay to keep type readable across the video's lighter frames */}
          <div
            className="absolute inset-0 z-0 vignette pointer-events-none"
            style={{
              background:
                'radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 60%, rgba(0,0,0,0.7) 100%), linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.55) 100%)',
            }}
          />

          {/* Navigation */}
          <nav className="relative z-10 flex flex-row justify-between items-center px-8 py-6 max-w-7xl mx-auto">
            <a
              href="#"
              className="text-3xl tracking-tight text-foreground"
              style={{ fontFamily: "'Instrument Serif', serif" }}
            >
              Marginalia<sup className="text-xs">®</sup>
            </a>

            <ul className="hidden md:flex items-center gap-9">
              {nav.map((item) => (
                <li key={item.label}>
                  <a
                    href="#"
                    className={
                      'text-sm transition-colors ' +
                      (item.active
                        ? 'text-foreground'
                        : 'text-muted-foreground hover:text-foreground')
                    }
                  >
                    {item.label}
                  </a>
                </li>
              ))}
            </ul>

            <button
              className="liquid-glass rounded-full px-6 py-2.5 text-sm text-foreground hover:scale-[1.03]"
              type="button"
            >
              {t.ctaLabel}
            </button>
          </nav>

          {/* Hero */}
          <section className="relative z-10 flex flex-col items-center text-center px-6 pt-32 pb-40 py-[90px]">
            {/* Tiny eyebrow */}
            <p
              className="animate-fade-rise text-[11px] uppercase tracking-[0.32em] text-muted-foreground mb-8"
            >
              <span className="inline-block align-middle w-8 h-px bg-white/30 mr-3" />
              A quiet society for readers
              <span className="inline-block align-middle w-8 h-px bg-white/30 ml-3" />
            </p>

            <h1
              className="animate-fade-rise font-normal text-foreground text-5xl sm:text-7xl md:text-8xl leading-[0.95] max-w-7xl"
              style={{
                fontFamily: "'Instrument Serif', serif",
                letterSpacing: '-2.46px',
              }}
            >
              {renderHeadline(t.headlineVariant)}
            </h1>

            <p className="animate-fade-rise-delay text-muted-foreground text-base sm:text-lg max-w-2xl mt-8 leading-relaxed">
              A reading room for the patient and the curious. We gather the books
              worth slowing down for, keep notes in the margins, and send a long
              letter when something extraordinary lands on the desk.
            </p>

            <button
              className="animate-fade-rise-delay-2 liquid-glass rounded-full px-14 py-5 text-base text-foreground mt-12 hover:scale-[1.03] cursor-pointer"
              type="button"
            >
              {t.ctaLabel}
            </button>

            <p className="animate-fade-rise-delay-3 mt-6 text-xs text-muted-foreground/80">
              Free to join · A new dispatch every Sunday morning
            </p>
          </section>

          {/* Floating stats card — quiet, off to the side */}
          {t.showStats && (
            <div className="animate-fade-rise-delay-3 hidden lg:flex absolute right-8 top-1/2 -translate-y-1/2 z-10 flex-col gap-3 w-[220px]">
              <div className="liquid-glass rounded-2xl px-5 py-4">
                <div
                  className="text-3xl text-foreground"
                  style={{ fontFamily: "'Instrument Serif', serif" }}
                >
                  41,208
                </div>
                <div className="text-[11px] uppercase tracking-[0.22em] text-muted-foreground mt-1">
                  Readers worldwide
                </div>
              </div>
              <div className="liquid-glass rounded-2xl px-5 py-4">
                <div
                  className="text-3xl text-foreground"
                  style={{ fontFamily: "'Instrument Serif', serif" }}
                >
                  312
                </div>
                <div className="text-[11px] uppercase tracking-[0.22em] text-muted-foreground mt-1">
                  Books in rotation
                </div>
              </div>
              <div className="liquid-glass rounded-2xl px-5 py-4">
                <div
                  className="text-3xl text-foreground"
                  style={{ fontFamily: "'Instrument Serif', serif" }}
                >
                  Sun · 7am
                </div>
                <div className="text-[11px] uppercase tracking-[0.22em] text-muted-foreground mt-1">
                  Next dispatch
                </div>
              </div>
            </div>
          )}

          {/* Left rail — "currently reading" badge */}
          <div className="animate-fade-rise-delay-4 hidden lg:flex absolute left-8 top-1/2 -translate-y-1/2 z-10 flex-col items-start gap-3 w-[220px]">
            <div className="liquid-glass rounded-2xl p-4">
              <div className="text-[10px] uppercase tracking-[0.28em] text-muted-foreground mb-3">
                Currently on the desk
              </div>
              <div className="flex gap-3">
                <div
                  className="w-12 h-16 rounded-sm flex-shrink-0"
                  style={{
                    background:
                      'repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0 6px, rgba(255,255,255,0.04) 6px 12px)',
                    border: '1px solid rgba(255,255,255,0.12)',
                  }}
                  aria-label="Book cover placeholder"
                />
                <div className="text-left">
                  <div
                    className="text-foreground text-base leading-tight"
                    style={{ fontFamily: "'Instrument Serif', serif" }}
                  >
                    Notes on Slow Attention
                  </div>
                  <div className="text-[11px] text-muted-foreground mt-1">
                    Essay · 9 min read
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* Bottom ticker */}
          {t.showTicker && (
            <div className="absolute bottom-0 left-0 right-0 z-10 pb-6 pointer-events-none">
              <div className="hairline h-px mx-8 mb-4" />
              <div className="overflow-hidden mask-fade">
                <div className="flex ticker-track whitespace-nowrap text-muted-foreground text-xs tracking-[0.18em] uppercase">
                  {[...tickerItems, ...tickerItems].map((item, i) => (
                    <span key={i} className="px-8 inline-flex items-center gap-8">
                      {item}
                      <span className="inline-block w-1 h-1 rounded-full bg-white/30" />
                    </span>
                  ))}
                </div>
              </div>
            </div>
          )}

        </section>
        {/* ===== /HERO ===== */}

        {window.MgOnTheDesk && <window.MgOnTheDesk />}
        {window.MgShelves   && <window.MgShelves />}
        {window.MgJournal   && <window.MgJournal />}
        {window.MgLetters   && <window.MgLetters />}
        {window.MgJoinRoom  && <window.MgJoinRoom ctaLabel={t.ctaLabel} />}
        {window.MgFooter    && <window.MgFooter />}

          {/* Tweaks panel */}
          {window.TweaksPanel && (
            <window.TweaksPanel title="Tweaks">
              <window.TweakSection title="Content">
                <window.TweakSelect
                  label="Headline"
                  value={t.headlineVariant}
                  onChange={(v) => setTweak('headlineVariant', v)}
                  options={[
                    { value: 'stories', label: 'Stories rise through silence' },
                    { value: 'readers', label: 'Readers who live between lines' },
                    { value: 'margins', label: 'The world lives in margins' },
                  ]}
                />
                <window.TweakText
                  label="CTA label"
                  value={t.ctaLabel}
                  onChange={(v) => setTweak('ctaLabel', v)}
                />
              </window.TweakSection>

              <window.TweakSection title="Atmosphere">
                <window.TweakColor
                  label="Palette"
                  value={t.palette}
                  onChange={(v) => setTweak('palette', v)}
                  options={Object.keys(PALETTES).map((k) => `hsl(${PALETTES[k].bg})`)}
                  optionValues={Object.keys(PALETTES)}
                />
                <window.TweakSlider
                  label="Video opacity"
                  value={t.videoOpacity}
                  min={0.15}
                  max={1}
                  step={0.05}
                  onChange={(v) => setTweak('videoOpacity', v)}
                />
              </window.TweakSection>

              <window.TweakSection title="Layout">
                <window.TweakToggle
                  label="Show side stats"
                  value={t.showStats}
                  onChange={(v) => setTweak('showStats', v)}
                />
                <window.TweakToggle
                  label="Show bottom ticker"
                  value={t.showTicker}
                  onChange={(v) => setTweak('showTicker', v)}
                />
              </window.TweakSection>
            </window.TweaksPanel>
          )}
        </div>
      );
    }

    // Some TweakColor implementations accept just `options`; pass swatches w/ a separate value list via a small wrapper if needed.
    // The starter accepts colors directly and stores them; we map the chosen color back to a palette key.
    // To avoid that complexity, override TweakColor below with a simple swatch row.
    const ColorSwatches = ({ label, value, onChange }) => (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.7)' }}>{label}</div>
        <div style={{ display: 'flex', gap: 8 }}>
          {Object.entries(PALETTES).map(([key, p]) => (
            <button
              key={key}
              onClick={() => onChange(key)}
              title={p.name}
              style={{
                width: 28,
                height: 28,
                borderRadius: 999,
                background: `hsl(${p.bg})`,
                border: value === key ? '2px solid white' : '1px solid rgba(255,255,255,0.25)',
                cursor: 'pointer',
              }}
            />
          ))}
        </div>
      </div>
    );

    // Patch: if TweakColor signature in the starter doesn't support optionValues, monkey-patch with ColorSwatches.
    if (window.TweakColor) {
      const Original = window.TweakColor;
      window.TweakColor = (props) => {
        if (props && props.optionValues) {
          return <ColorSwatches label={props.label} value={props.value} onChange={props.onChange} />;
        }
        return <Original {...props} />;
      };
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
